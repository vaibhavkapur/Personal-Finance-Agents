services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: passage
      POSTGRES_USER: passage
      POSTGRES_PASSWORD: local_fixture_only
    volumes:
      - passage-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passage -d passage"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    ports:
      - "127.0.0.1:8088:8088"
    environment: &runtime
      DATABASE_URL: postgresql+psycopg://passage:local_fixture_only@postgres:5432/passage
      DEMO_MODE: "1"
      EMBEDDED_WORKER: "0"
      MOCK_WEBHOOK_SECRET: local-simulator-only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    build: .
    command: ["python", "-m", "backend.app.worker"]
    environment: *runtime
    depends_on:
      api:
        condition: service_healthy
volumes:
  passage-db:
