title: "Inheritance and Dormant-Asset Navigator"
description: "A working, local US estate-administration prototype based on the supplied plan. React + TypeScript provides the estate workspace; FastAPI runs the deterministic authorization and claim workflow. All people, institutions, requirements, records, approvals and distributions in the demo are synthetic."
url: ""
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: dark
aux_links:
  GitHub:
    - "https://github.com/vaibhavkapur/Personal-Finance-Agents/tree/main/projects/Inheritance-and-Dormant-Asset-Navigator"
aux_links_new_tab: true
nav_sort: order
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
back_to_top: true
back_to_top_text: "Back to top"
footer_content: "Inheritance and Dormant-Asset Navigator application documentation."
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
