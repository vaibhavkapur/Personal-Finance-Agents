title: "Refund and Fee-Recovery Agent"
description: "A consumer money-recovery agent that finds a promised refund missing from a US customer's account, assembles the evidence, follows up with the merchant through an approved message, tracks a separate issuer-dispute lane, and verifies the eventual credit against the account feed."
url: ""
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: dark
aux_links:
  GitHub:
    - "https://github.com/vaibhavkapur/Personal-Finance-Agents/tree/main/projects/Refund-and-Fee-Recovery-Agent"
aux_links_new_tab: true
nav_sort: order
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
back_to_top: true
back_to_top_text: "Back to top"
footer_content: "Refund and Fee-Recovery Agent application documentation."
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
