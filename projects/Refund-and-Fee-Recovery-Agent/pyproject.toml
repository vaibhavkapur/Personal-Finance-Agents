[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-and-fee-recovery-agent"
version = "0.1.0"
description = "Consumer refund and fee-recovery agent prototype (mock providers, synthetic fixtures)."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn>=0.29,<0.35",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
