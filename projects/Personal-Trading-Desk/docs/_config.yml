title: "Personal Trading Desk"
description: "A personal paper-trading desk with versioned mandates, deterministic exposure checks, exact-action approvals, an independent mock broker, and reconciliation of fills, cancellations, positions, and cash."
url: ""
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: dark
aux_links:
  GitHub:
    - "https://github.com/vaibhavkapur/Personal-Finance-Agents/tree/main/projects/Personal-Trading-Desk"
aux_links_new_tab: true
nav_sort: order
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
back_to_top: true
back_to_top_text: "Back to top"
footer_content: "Personal Trading Desk application documentation."
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
