title: "Fraud-Response Concierge"
description: "A working customer-side lost-wallet prototype for two fictional US institutions. It coordinates explicit approvals, independently verified card protection, charge reports, bank questions, replacement delivery, and recovery. The original brief is preserved in `docs/plan.md`."
url: ""
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: dark
aux_links:
  GitHub:
    - "https://github.com/vaibhavkapur/Personal-Finance-Agents/tree/main/projects/Fraud-Response-Concierge"
aux_links_new_tab: true
nav_sort: order
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
back_to_top: true
back_to_top_text: "Back to top"
footer_content: "Fraud-Response Concierge application documentation."
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
