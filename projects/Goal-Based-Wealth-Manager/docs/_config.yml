title: "Goal-Based Wealth Manager"
description: "A goal-based wealth-planning prototype that calculates funding gaps, previews contribution and rebalance baskets, binds customer approval to exact actions, and reconciles partial execution against an independent mock custodian."
url: ""
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: dark
aux_links:
  GitHub:
    - "https://github.com/vaibhavkapur/Personal-Finance-Agents/tree/main/projects/Goal-Based-Wealth-Manager"
aux_links_new_tab: true
nav_sort: order
heading_anchors: true
search_enabled: true
search:
  heading_level: 3
  previews: 3
back_to_top: true
back_to_top_text: "Back to top"
footer_content: "Goal-Based Wealth Manager application documentation."
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
