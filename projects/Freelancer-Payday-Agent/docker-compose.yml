services:
  api:
    build: .
    ports:
      - "127.0.0.1:8012:8012"
    volumes:
      - payday-data:/data
    environment:
      PAYDAY_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build: .
    command: ["python", "-m", "backend.app.worker"]
    volumes:
      - payday-data:/data
    environment:
      PAYDAY_DATA_DIR: /data
    depends_on:
      api:
        condition: service_healthy
volumes:
  payday-data:
