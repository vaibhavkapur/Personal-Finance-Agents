title: "Insurance Claims Advocate"
description: "A delayed-baggage claims advocate prototype. It turns source-linked travel documents into a reviewable claim packet, follows a mock insurer\u2019s requests, explains the decision against a fixture policy, and reconciles any simulated payout before closure."
url: ""
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.0
color_scheme: dark
aux_links:
