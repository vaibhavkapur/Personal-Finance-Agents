[project]
name = "insurance-claims-advocate"
version = "0.1.0"
description = "Delayed-baggage claims advocate prototype: evidence intake, policy rules, persistent insurer case workflow and settlement verification against a mock insurer."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<0.116",
  "pydantic>=2.5,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.29,<0.31",
  "httpx>=0.27,<0.28",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
postgres = ["psycopg[binary]>=3.1,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
