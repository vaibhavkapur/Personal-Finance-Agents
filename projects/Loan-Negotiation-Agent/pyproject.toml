[project]
name = "loan-negotiation-agent"
version = "0.1.0"
description = "Borrower-side mortgage comparison, negotiation and mock refinance coordination (prototype)"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.31",
  "pydantic>=2.10,<2.11",
  "SQLAlchemy>=2.0,<2.1",
  "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<0.25"]
postgres = ["psycopg[binary]>=3.2,<3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["backend", "backend.app"]
